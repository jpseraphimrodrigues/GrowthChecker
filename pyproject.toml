[project]
name = "growthchecker"
version = "0.1.0"
description = "Acompanhamento do crescimento infantil com referências da OMS"
requires-python = ">=3.11,<3.15"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
